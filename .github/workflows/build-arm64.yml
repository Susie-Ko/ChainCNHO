name: Build Multi Platform (Production)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # =========================
  # Linux (CentOS7 Compatible)
  # =========================
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build CentOS7 Compatible Binary
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            centos:7 \
            bash -c '

            yum install -y wget git gcc gcc-c++ make tar gzip

            wget https://go.dev/dl/go1.21.9.linux-amd64.tar.gz

            tar -C /usr/local -xzf go1.21.9.linux-amd64.tar.gz

            export PATH=/usr/local/go/bin:$PATH

            export CGO_ENABLED=1
            export GOOS=linux
            export GOARCH=amd64

            go build -o cnhod-linux-amd64 ./cmd/cnhod
            '

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: cnhod-linux-amd64
          path: cnhod-linux-amd64

  # =========================
  # macOS Intel (10.15)
  # =========================
  build-macos-amd64:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.9'

      - name: Build macOS Intel
        run: |
          export CGO_ENABLED=1
          export GOOS=darwin
          export GOARCH=amd64

          export MACOSX_DEPLOYMENT_TARGET=10.15

          export CC="clang -target x86_64-apple-macos10.15"
          export CXX="clang++ -target x86_64-apple-macos10.15"

          go build -o cnhod-darwin-amd64 ./cmd/cnhod

      - name: Upload macOS Intel binary
        uses: actions/upload-artifact@v4
        with:
          name: cnhod-darwin-amd64
          path: cnhod-darwin-amd64

  # =========================
  # macOS Apple Silicon
  # =========================
  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.9'

      - name: Build macOS ARM64
        run: |
          export CGO_ENABLED=1
          export GOOS=darwin
          export GOARCH=arm64

          export MACOSX_DEPLOYMENT_TARGET=11.0

          export CC="clang -target arm64-apple-macos11"
          export CXX="clang++ -target arm64-apple-macos11"

          go build -o cnhod-darwin-arm64 ./cmd/cnhod

      - name: Upload macOS ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: cnhod-darwin-arm64
          path: cnhod-darwin-arm64

  # =========================
  # Windows 11
  # =========================
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.9'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            unzip
            curl

      - name: Download wasmvm
        shell: msys2 {0}
        run: |
          curl -L https://github.com/CosmWasm/wasmvm/releases/download/v1.1.1/wasmvm_windows_x86_64.zip -o wasmvm.zip

          unzip wasmvm.zip

          ls

      - name: Build Windows
        shell: msys2 {0}
        run: |
          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=amd64

          export CGO_LDFLAGS="-L$(pwd)"

          go build -o cnhod-windows-amd64.exe ./cmd/cnhod

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: cnhod-windows-amd64
          path: |
            cnhod-windows-amd64.exe
            wasmvm.dll